name: Build installers

# macOS .dmg must be built on macOS and .deb/.rpm on Linux, so each platform
# gets its own runner. Pushing a v* tag also publishes a draft release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Creating the release needs write access to repository contents. The default
# GITHUB_TOKEN is read-only, which is why every 1.5.0 job built perfectly and
# then failed on "Attach to release" — the builds were never the problem.
# Scoped to the minimum: nothing here needs packages, issues or deployments.
permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            slug: windows
            name: Windows (nsis + portable)
            command: npm run package:win
            artifacts: |
              release/*.exe
              release/*.blockmap
              release/latest.yml
          # macOS is split by architecture, one native runner each. Building both
          # on a single host means electron-builder rebuilding better-sqlite3 and
          # @serialport/bindings-cpp for the *other* architecture, which is the
          # same cross-arch native rebuild that already forced Windows to x64
          # only. macos-latest is Apple Silicon now, so the x64 half needs an
          # Intel runner rather than cross-compilation.
          - os: macos-latest
            slug: macos-arm64
            name: macOS arm64 (dmg + zip)
            command: npm run build && npx electron-builder --mac --arm64 -p never
            artifacts: |
              release/*.dmg
              release/*.zip
              release/latest-mac.yml
          # macos-13 is retired — the label no longer maps to any runner, so a
          # job asking for it sits queued forever rather than failing. macos-15-intel
          # is the current Intel image.
          - os: macos-15-intel
            slug: macos-x64
            name: macOS x64 (dmg + zip)
            command: npm run build && npx electron-builder --mac --x64 -p never
            artifacts: |
              release/*.dmg
              release/*.zip
              release/latest-mac.yml
          - os: ubuntu-latest
            slug: linux
            name: Linux (AppImage + deb + rpm)
            command: npm run package:linux
            artifacts: |
              release/*.AppImage
              release/*.AppImage.zsync
              release/*.deb
              release/*.rpm
              release/latest-linux.yml

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # rpmbuild is not on the ubuntu image by default and the rpm target needs
      # it; zsync builds the AppImage update metadata in the step below.
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm zsync

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build installers
        run: ${{ matrix.command }}
        env:
          # Unsigned builds; supply certificates as secrets to enable signing.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # electron-builder writes latest-linux.yml, which is the *in-app* updater's
      # feed. It does not write the AppImage's own update mechanism — the
      # .upd_info ELF section is left zeroed and no .zsync is produced — so
      # without this step a released AppImage is invisible to AppImageUpdate and
      # to managers like KEM-A AppManager. See tools/APPIMAGE-UPDATES.md.
      - name: Add AppImage update information
        if: runner.os == 'Linux'
        run: |
          set -e
          appimage=$(ls release/*.AppImage)
          node tools/appimage-update-info.js "$appimage"
          readelf -p .upd_info "$appimage" | grep -q 'gh-releases-zsync' \
            || { echo "update information missing from $appimage"; exit 1; }

      # Patching the AppImage in place leaves its length unchanged, so a stale
      # sha512 in latest-linux.yml looks entirely plausible — 1.5.0 published one
      # and electron-updater rejected the download it had just made. The tool
      # re-hashes the feed now; this proves it, for every artifact in it.
      - name: Verify the Linux feed matches the artifacts
        if: runner.os == 'Linux'
        run: |
          node -e '
            const fs = require("fs"), crypto = require("crypto")
            const text = fs.readFileSync("release/latest-linux.yml", "utf8")
            const entry = /- url: (.+)\n\s+sha512: (.+)\n\s+size: (\d+)/g
            let m, bad = 0, seen = 0
            while ((m = entry.exec(text))) {
              const bytes = fs.readFileSync("release/" + m[1].trim())
              const sha = crypto.createHash("sha512").update(bytes).digest("base64")
              seen++
              if (sha !== m[2].trim() || bytes.length !== Number(m[3])) {
                console.error("stale entry for " + m[1].trim())
                bad++
              }
            }
            if (!seen) { console.error("no entries found in latest-linux.yml"); process.exit(1) }
            console.log(seen + " entries verified against the built artifacts")
            process.exit(bad ? 1 : 0)
          '

      - uses: actions/upload-artifact@v7
        with:
          name: smartcom-revisited-${{ matrix.slug }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

      # The `latest*.yml` manifests are what the in-app updater reads, so they
      # have to be attached to the release alongside the installers — without
      # them every installed copy stays on its current version forever.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: ${{ matrix.artifacts }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Both macOS jobs write their own release/latest-mac.yml describing only the
  # architecture they built, and both attach it — so whichever finishes second
  # silently replaces the other and the published feed covers one architecture.
  # This runs after both and replaces that asset with the merged document.
  #
  # It also runs on main, where it merges without attaching: the merge is then
  # exercised by every ordinary push instead of first running during a release.
  merge-mac-feed:
    name: macOS update feed (both architectures)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: smartcom-revisited-macos-x64
          path: feeds/x64

      - uses: actions/download-artifact@v8
        with:
          name: smartcom-revisited-macos-arm64
          path: feeds/arm64

      # x64 goes first: it supplies the legacy top-level path/sha512 that
      # electron-updater versions too old to read `files:` fall back to, and a
      # client that old is far more likely to be an Intel Mac.
      - name: Merge the per-architecture feeds
        run: |
          set -e
          mkdir -p release
          node tools/merge-mac-feed.js release/latest-mac.yml \
            feeds/x64/latest-mac.yml feeds/arm64/latest-mac.yml
          for arch in x64 arm64; do
            grep -q "$arch" release/latest-mac.yml \
              || { echo "merged feed does not mention $arch"; exit 1; }
          done
          cat release/latest-mac.yml

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: release/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
